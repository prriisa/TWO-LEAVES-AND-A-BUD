<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-grey">
    <header class="flex justify-center">
        <div
            class="fixed header-1 w-full bg-[#292756] text-white text-[0.6rem] flex items-center justify-center tracking-[0.3px]">

        <div class="header-2 w-[98%] bg-white rounded-lg border-1 fixed top-[2.2rem] flex items-center justify-between">
            <div class="navbar-1 flex gap-[2rem] w-[31%]">
                <h2 class="flex items-center justify-center gap-[0.2rem] font-[Reckless]">Shop <button
                        class="border-1 rounded-full bg-[rgb(193, 228, 248)]"><img class="w-[0.8rem] h-[0.8rem]"
                            src="./icon/keyboard_arrow_down_24dp_292756_FILL0_wght400_GRAD0_opsz24.svg" alt=""></button>
                </h2>
                <h2 class="flex items-center justify-center gap-[0.2rem] font-[Reckless]">Learn <button
                        class="border-1 rounded-full bg-[rgb(193, 228, 248)]"><img class="w-[0.8rem] h-[0.8rem]"
                            src="./icon/keyboard_arrow_down_24dp_292756_FILL0_wght400_GRAD0_opsz24.svg" alt=""></button>
                </h2>
                <h2 class="flex items-center justify-center gap-[0.2rem] font-[Reckless]">Reviews</h2>
            </div>
            <div class="navbar-2">
                <img class="w-20 " src="./logo/Twoleaves_logo.svg" alt="">
            </div>
            <div class="navbar-3 flex items-center gap-[2rem]">
                <p class="font-[RobotoMono] text-[0.6rem] font-semibold">MY ACCOUNT</p>
                <p class="font-[RobotoMono] text-[0.6rem] font-semibold">CAFE & WHOLESALE PARTENERS</p>
                <p class="font-[RobotoMono] text-[0.6rem] font-semibold">TEA JOURNAL</p>
                <img src="./logo/shopping_bag_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="">
            </div>
        </div>
    </header>
    <main class=" w-full">
        <section class="hero border-b-1">
        </section>
        <section class="section-2 w-full bg-[#FBF9EB] flex items-center justify-center text-center leading-tight">
            <p>A great cup starts with a careful <br> pluck - the top two leaves and a bud.</p>
        </section>
        <section class="section-3 h-[120vh] bg-[#FBF9EB]">
            <div class="bestseller font-[midnight]">BEST SELLERS</div>
        </section>
    </main>

</body>

</html>
